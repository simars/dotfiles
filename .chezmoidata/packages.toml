[darwin.brew]
formulae = [
    "age",
    "bash",
    "bat",
    "bitwarden-cli",
    "btop",
    "colima",
    "coreutils",
    "curl",
    "docker",
    "docker-compose",
    "duf",
    "dust",
    "eza",
    "fd",
    "findutils",
    "fx",
    "fzf",
    "gawk",
    "git",
    "gitleaks",
    "gnu-sed",
    "gnu-tar",
    "grep",
    "herdr",
    "httpie",
    "iproute2mac",
    "jq",
    "lazygit",
    "make",
    "mise",
    "neovim",
    "pstree",
    "ripgrep",
    "rsync",
    "shellcheck",
    "starship",
    "tmux",
    "tree-sitter-cli",
    "vim",
    "watch",
    "wget",
    "zoxide",
    "zsh"
]
casks = [
    "1password-cli",
    "font-jetbrains-mono-nerd-font",
    "iterm2",
    "warp",
    "wave"
]

# Omarchy: installed only with Omarchy's own commands (`omarchy pkg add`, `omarchy pkg aur add`), never pacman, apt
# or downloads. Omarchy already ships the rest of the Mac list (tmux, neovim, herdr, mise, eza, bat, fd, fzf, ...).
# Runtimes come from `omarchy install dev-env <lang>`, not from here.
[omarchy]
# bitwarden-cli is left out: Arch's package needs nodejs-lts-jod (Node 22), which conflicts with Omarchy's nodejs,
# and pacman then cancels the whole install.
pacman = [
    "age",
    "duf",
    "dust",
    "fx",
    "gitleaks",
    "httpie",
    "shellcheck",
    "vim",
    "wget",
    "zsh"
]
# AUR packages, installed with `omarchy pkg aur add`. None today: LunarVim is installed by hand, outside this
# repository (lunarvim-git; then link ~/.local/share/lunarvim/lvim to /usr/share/lunarvim).
aur = []
