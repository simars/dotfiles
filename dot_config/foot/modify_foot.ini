#!/usr/bin/env bash
# chezmoi modify script for foot's ~/.config/foot/foot.ini on Omarchy: Omarchy ships and refreshes this file, so only
# one setting is set here and everything else is passed through. selection-target=both: selecting text also copies it
# to the clipboard (foot's default is the primary selection only, which Omarchy cannot paste: primary-paste=none), as
# in iTerm2, Wave, herdr and tmux. Cheatsheet: "Copy and Paste".
set -euo pipefail
awk '
/^[[:space:]]*\[/ {
    is_main = ($0 ~ /^[[:space:]]*\[main\][[:space:]]*$/)
    # Settings above the first section header belong to [main] too.
    if (!done && (in_main || (!seen_header && NR > 1 && !is_main))) { print "selection-target=both"; done = 1 }
    in_main = is_main
    seen_header = 1
    print; next
}
(in_main || !seen_header) && /^[[:space:]]*selection-target[[:space:]]*=/ {
    if (!done) { print "selection-target=both"; done = 1 }
    next
}
{ print }
END {
    if (!done) {
        if (in_main || !seen_header) print "selection-target=both"
        else { print ""; print "[main]"; print "selection-target=both" }
    }
}'
