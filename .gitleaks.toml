[extend]
useDefault = true

[allowlist]
description = "Allow encrypted age files, CI mocks, and public age/ssh recipient keys"
paths = [
  '''\.age$''',
  '''\.github/workflows/ci\.yml'''
]
regexes = [
  '''age1[a-z0-9]{58}''',
  '''ssh-rsa AAAAB3NzaC1yc2E[A-Za-z0-9+/=]+''',
  '''ssh-ed25519 AAAAC3NzaC1lZDI1NTE5[A-Za-z0-9+/=]+'''
]
